<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><meta name="theme-color" content="#0D9488"/><title>Desafio Projeto Verão 21 — Demonstração</title>
<style>
:root{font-family:Inter,system-ui,-apple-system,sans-serif;color:#10201d;background:#fff8ef}*{box-sizing:border-box}body{margin:0}button,input,select{font:inherit}button{cursor:pointer}header{background:#10201d;color:white;padding:18px 24px;display:flex;justify-content:space-between;align-items:center;gap:12px}header strong{font-size:20px}header small{display:block;color:#b3d5c8}header span{font-size:12px;background:#ff7a45;color:#1b1b1b;border-radius:18px;padding:7px 10px}.layout{display:flex;min-height:calc(100vh - 76px)}aside{width:220px;background:#e8f4ee;padding:20px 12px;flex-shrink:0}nav{display:grid;gap:8px}nav button{border:0;background:transparent;text-align:left;border-radius:12px;padding:14px;color:#10201d}nav button.active{background:#0d9488;color:white}main{max-width:1140px;width:100%;padding:28px;margin:auto}.hero{background:linear-gradient(120deg,#0d9488,#10201d);border-radius:22px;color:white;padding:28px;display:flex;justify-content:space-between;gap:20px}.hero h1{margin:0 0 10px;font-size:clamp(24px,4vw,38px)}.hero p{max-width:650px;line-height:1.6}.sun{font-size:72px;align-self:center}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:16px;margin:20px 0}.card{background:white;border-radius:18px;padding:18px;border:1px solid #e0e9e3;box-shadow:0 3px 12px #10201d0a}.card h3{margin:10px 0}.card p{line-height:1.55;color:#52675e}.card button,.primary{background:#0d9488;color:white;border:0;border-radius:12px;padding:12px 15px;min-height:44px}.secondary{background:#e8f4ee!important;color:#10201d!important}.muted{color:#627a72}.tag{display:inline-block;background:#e8f4ee;color:#0d746c;padding:5px 10px;border-radius:20px;font-size:12px}.days{display:grid;grid-template-columns:repeat(auto-fit,minmax(135px,1fr));gap:12px;margin:18px 0}.day{background:white;border:1px solid #e1e8e2;border-radius:15px;padding:14px;text-align:left;min-height:110px}.day.done{border-color:#0d9488;background:#e8f4ee}.day b{display:block;color:#0d9488;margin-bottom:8px}.detail{background:white;border-radius:20px;padding:22px;margin-top:16px;border:1px solid #e0e9e3}.detail li{padding:6px 0;line-height:1.5}.progress{height:12px;background:#dbe7df;border-radius:20px;overflow:hidden}.progress div{height:100%;background:#ff7a45;transition:width .2s}.visual{height:160px;background:linear-gradient(135deg,#e8f4ee,#fff8ef);display:flex;align-items:center;justify-content:center;font-size:72px;border-radius:12px}.notice{padding:12px 15px;background:#fff1dc;border-left:4px solid #ff7a45;border-radius:8px;margin:16px 0;font-size:14px}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.row input{padding:12px;border:1px solid #ccd9d1;border-radius:10px;min-width:150px}.check{display:flex;gap:10px;align-items:center;margin:10px 0}.check input{width:20px;height:20px}footer{padding:25px;color:#627a72;text-align:center;font-size:13px}h2{margin-top:28px}a{color:#0d746c}@media(max-width:720px){.layout{display:block}aside{width:100%;position:sticky;bottom:0;z-index:3;padding:5px;box-shadow:0 -2px 15px #0001}nav{display:flex;overflow-x:auto;gap:4px}nav button{font-size:12px;padding:12px 10px;white-space:nowrap;flex:1;text-align:center}main{padding:16px;padding-bottom:90px}.hero{padding:22px}.sun{display:none}header{padding:14px}header strong{font-size:16px}.days{grid-template-columns:repeat(3,1fr)}}
</style></head><body><header><div><strong>☀️ Projeto Verão 21</strong><small>Organização, alimentação e movimento possível</small></div><span>DEMONSTRAÇÃO • sem conta real</span></header><div class="layout"><aside><nav id="nav"></nav></aside><main id="app"></main></div><footer>Material demonstrativo educativo. Conteúdos alimentares e de movimento são rascunhos para revisão profissional. Não substitui acompanhamento individual.</footer>
<script>
const missions=[
"Preparar meu começo","Conhecer minha despensa","Organizar as compras","Montar uma refeição simples","Reservar um horário","Planejar o fim de semana","Revisar a primeira semana","Repetir o que funcionou","Preparar com antecedência","Planejar um lanche","Organizar meu ambiente","Conferir minha prática","Fazer uma troca possível","Revisar a segunda semana","Planejar refeições fora","Conferir receitas favoritas","Preparar uma refeição econômica","Proteger um horário da rotina","Revisar minhas dificuldades","Planejar o dia 22","Concluir e continuar"];
const steps=[
["Escolha uma data possível para começar.","Conheça as áreas do aplicativo.","Defina uma ação pequena que cabe na sua rotina."],
["Confira os ingredientes disponíveis na cozinha.","Anote os alimentos que precisam ser usados primeiro.","Separe uma ideia de refeição usando o que já tem."],
["Escolha receitas para alguns dias.","Confira os ingredientes necessários.","Atualize a lista de compras antes de sair."],
["Escolha uma combinação de alimentos disponíveis.","Leia o modo de preparo completo.","Reserve tempo para preparar e organizar a refeição."],
["Veja sua disponibilidade da semana.","Escolha um horário possível para uma atividade revisada.","Registre o horário na sua agenda."],
["Pense nos compromissos do fim de semana.","Escolha uma opção prática de alimentação.","Separe o que precisa levar ou comprar."],
["Reveja as ações que conseguiu realizar.","Anote uma dificuldade sem se julgar.","Escolha uma adaptação simples para a próxima semana."],
["Identifique preparos que foram fáceis.","Salve duas receitas favoritas.","Organize uma sequência simples para os próximos dias."],
["Confira ingredientes e utensílios necessários.","Separe o que puder com antecedência.","Consulte orientações de conservação antes de guardar."],
["Veja opções de lanches na biblioteca.","Escolha uma opção adequada à sua rotina.","Anote os ingredientes na lista."],
["Deixe sua lista de compras acessível.","Organize utensílios e alimentos que utiliza com frequência.","Separe um espaço para preparar refeições."],
["Leia as orientações de uma sessão revisada.","Confira o ambiente e os apoios necessários.","Não aumente a intensidade por conta própria."],
["Identifique um ingrediente indisponível.","Confira possíveis substituições e alergênicos.","Atualize a receita e a lista de compras."],
["Revise as ações realizadas na semana.","Registre o que ajudou sua constância.","Escolha um ajuste para a próxima semana."],
["Consulte o cardápio do local quando possível.","Planeje uma opção sem regras punitivas.","Retome sua rotina normalmente depois."],
["Reveja suas receitas favoritas.","Escolha preparos que deseja repetir.","Monte uma lista curta para a próxima semana."],
["Veja os ingredientes disponíveis.","Compare preços reais antes de comprar.","Prepare uma refeição simples aproveitando o que tem."],
["Escolha um momento para alimentação ou movimento.","Registre esse período na agenda.","Pense em uma alternativa caso o plano mude."],
["Anote um obstáculo que se repetiu.","Identifique uma pequena mudança possível.","Teste a mudança sem exigir perfeição."],
["Escolha hábitos que deseja continuar.","Defina em quais dias pretende praticá-los.","Organize o primeiro passo após o programa."],
["Reveja as missões concluídas.","Registre aprendizados e preferências.","Monte seu plano de continuidade sem prometer resultados físicos."]];
const recipes=[
["Ovos mexidos com tomate","Café da manhã","🍳",["2 ovos","1 tomate pequeno","1 colher (chá) de óleo"],["Lave e pique o tomate.","Aqueça o óleo em fogo baixo.","Adicione o tomate e refogue brevemente.","Acrescente os ovos e mexa até cozinhar completamente."]],
["Mingau de aveia com banana","Café da manhã","🥣",["3 colheres (sopa) de aveia","200 ml de leite ou alternativa adequada","1 banana"],["Misture a aveia e o leite em panela.","Cozinhe em fogo baixo mexendo até engrossar.","Desligue e adicione a banana cortada."]],
["Pão com ovo","Café da manhã","🥖",["1 pão francês","1 ovo","1 colher (chá) de óleo"],["Aqueça a frigideira com óleo.","Cozinhe o ovo completamente.","Abra o pão e coloque o ovo."]],
["Iogurte com fruta","Lanche","🍓",["1 pote de iogurte natural","1 fruta lavada"],["Lave e corte a fruta.","Coloque o iogurte em tigela.","Misture e sirva."]],
["Panqueca de banana e aveia","Café da manhã","🥞",["1 banana madura","1 ovo","2 colheres (sopa) de aveia"],["Amasse a banana.","Misture o ovo e a aveia.","Cozinhe porções pequenas em frigideira até firmarem dos dois lados."]],
["Arroz, feijão e frango","Almoço","🍛",["Arroz cozido","Feijão cozido","Frango","Alho e óleo"],["Cozinhe o arroz e o feijão conforme preparo habitual.","Tempere o frango.","Cozinhe o frango completamente.","Monte o prato com os três preparos."]],
["Sopa de legumes","Jantar","🥕",["1 cenoura","1 batata","1 pedaço de abóbora","Água e temperos"],["Lave, descasque quando necessário e corte os legumes.","Coloque na panela com água suficiente para cobrir.","Cozinhe até ficarem macios.","Ajuste o tempero e sirva."]],
["Macarrão com sardinha","Almoço","🍝",["Macarrão","1 lata de sardinha","1 tomate","Alho"],["Cozinhe o macarrão conforme a embalagem.","Refogue alho e tomate.","Acrescente a sardinha e aqueça.","Misture ao macarrão cozido."]],
["Cuscuz com ovo","Café da manhã","🌽",["Flocão de milho","Água","1 ovo"],["Hidrate o flocão conforme a embalagem.","Cozinhe na cuscuzeira.","Prepare o ovo até ficar bem cozido.","Sirva junto ao cuscuz."]],
["Salada de frutas","Lanche","🍉",["Banana","Mamão","Outra fruta da estação"],["Lave as frutas.","Descasque e corte em pedaços.","Misture e sirva."]]];
const exercises=[["Marcha no lugar","🚶","Fique em pé em local livre de obstáculos e marche de modo confortável."],["Passos laterais","↔️","Dê passos curtos para os lados em espaço seguro."],["Mobilidade de ombros","🙆","Movimente os ombros suavemente dentro da amplitude confortável."],["Mobilidade de tornozelos","🦶","Com apoio estável, faça movimentos leves dos tornozelos."],["Sentar e levantar","🪑","Use cadeira estável; faça o movimento de forma controlada."],["Elevação de calcanhares","🦵","Com apoio firme, eleve e abaixe os calcanhares suavemente."],["Flexão na parede","🧱","Com as mãos apoiadas na parede, flexione e estenda os braços com controle."],["Elevação lateral dos braços","💪","Eleve os braços lateralmente até amplitude confortável."],["Extensão de quadril com apoio","🧍","Com apoio estável, mova uma perna para trás sem forçar a lombar."],["Ponte de quadril","🧘","Deitado em superfície adequada, eleve o quadril de forma controlada."],["Coordenação em pé","🎯","Alterne movimentos simples mantendo apoio próximo."],["Respiração tranquila","🌿","Sente-se confortavelmente e respire em ritmo natural."]];
const tabs=[["hoje","🏠 Hoje"],["dias","🗓️ 21 Dias"],["receitas","🍲 Receitas"],["movimento","🏃 Movimento"],["compras","🛒 Compras"],["bonus","🎁 Bônus"],["perfil","👤 Perfil"]];
let tab="hoje",selected=1,recipeIndex=0;let done=new Set(JSON.parse(localStorage.getItem("pv21_demo_done")||"[]"));let purchased=JSON.parse(localStorage.getItem("pv21_demo_list")||"[]");let start=localStorage.getItem("pv21_demo_start")||"";
function save(){localStorage.setItem("pv21_demo_done",JSON.stringify([...done]));localStorage.setItem("pv21_demo_list",JSON.stringify(purchased));}
function escapeHTML(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function phase(n){return n<=7?"Organizar":n<=14?"Praticar":"Continuar"}
function nav(){document.getElementById("nav").innerHTML=tabs.map(([k,v])=>'<button class="'+(tab===k?"active":"")+'" onclick="go(\''+k+'\')">'+v+'</button>').join("")}
function go(t){tab=t;nav();render();window.scrollTo(0,0)}
function toggle(n){done.has(n)?done.delete(n):done.add(n);save();render()}
function mission(n){selected=n;go("dias")}
function addIngredient(s){if(!purchased.some(x=>x.name===s))purchased.push({name:s,checked:false});save();render()}
function addRecipe(i){recipes[i][3].forEach(x=>{if(!purchased.some(y=>y.name===x))purchased.push({name:x,checked:false})});save();go("compras")}
function shoppingToggle(i){purchased[i].checked=!purchased[i].checked;save();render()}
function shoppingDelete(i){purchased.splice(i,1);save();render()}
function addManual(){const e=document.getElementById("newItem");if(e.value.trim()){addIngredient(e.value.trim());e.value=""}}
function pickRecipe(i){recipeIndex=i;render()}
function setStart(v){start=v;localStorage.setItem("pv21_demo_start",v);render()}
function card(title,desc,action,emoji){return '<article class="card"><div class="visual" aria-hidden="true">'+emoji+'</div><h3>'+title+'</h3><p>'+desc+'</p>'+action+'</article>'}
function render(){const app=document.getElementById("app");const percent=Math.round(done.size/21*100);let out='';
if(tab==="hoje")out='<section class="hero"><div><span class="tag">Sua jornada de 21 dias</span><h1>Um passo possível por dia ☀️</h1><p>Organize refeições, descubra hábitos e acompanhe o que você realmente fez. Sem metas físicas garantidas.</p><button class="primary" onclick="mission(1)">Começar pelo dia 1</button></div><div class="sun">🌻</div></section><h2>Seu progresso na demonstração</h2><div class="card"><strong>'+done.size+' de 21 missões concluídas ('+percent+'%)</strong><div class="progress" style="margin-top:12px"><div style="width:'+percent+'%"></div></div><p class="muted">Progresso salvo apenas neste navegador; não é uma conta de aluno.</p></div><div class="grid">'+card("Calendário completo","Consulte as três fases e marque missões realizadas.",'<button onclick="go(\'dias\')">Ver os 21 dias</button>',"🗓️")+card("Receitas ilustradas","Veja receitas de exemplo com ingredientes e preparo.",'<button onclick="go(\'receitas\')">Explorar receitas</button>',"🍲")+card("Movimento em casa","Conheça os movimentos propostos para revisão profissional.",'<button onclick="go(\'movimento\')">Explorar movimentos</button>',"🏃")+'</div>';
if(tab==="dias")out='<h1>Calendário de 21 dias</h1><p class="muted">Fase 1: Organizar • Fase 2: Praticar • Fase 3: Continuar</p><div class="days">'+missions.map((m,i)=>'<button class="day '+(done.has(i+1)?"done":"")+'" onclick="mission('+(i+1)+')"><b>Dia '+(i+1)+(done.has(i+1)?" ✓":"")+'</b>'+m+'</button>').join("")+'</div><section class="detail"><span class="tag">'+phase(selected)+'</span><h2>Dia '+selected+' — '+missions[selected-1]+'</h2><p>Missão educativa: realize os passos conforme sua disponibilidade.</p><ol>'+steps[selected-1].map(s=>'<li>'+s+'</li>').join("")+'</ol><button class="primary" onclick="toggle('+selected+')">'+(done.has(selected)?"Desfazer conclusão":"Marcar como feita")+'</button></section>';
if(tab==="receitas")out='<h1>Biblioteca de receitas</h1><div class="notice">Demonstração com 10 receitas iniciais em rascunho para revisão nutricional. O escopo completo prevê pelo menos 30 receitas.</div><div class="grid">'+recipes.map((r,i)=>card(r[0],r[1],'<button onclick="pickRecipe('+i+')">Ver receita</button>',r[2])).join("")+'</div><section class="detail"><h2>'+recipes[recipeIndex][0]+'</h2><span class="tag">Rascunho para revisão profissional</span><h3>Ingredientes</h3><ul>'+recipes[recipeIndex][3].map(x=>'<li>'+x+'</li>').join("")+'</ul><h3>Preparo</h3><ol>'+recipes[recipeIndex][4].map(x=>'<li>'+x+'</li>').join("")+'</ol><p class="muted">Rendimento, alergênicos, substituições e conservação precisam ser revisados antes da publicação.</p><button class="primary" onclick="addRecipe('+recipeIndex+')">Adicionar ingredientes à lista</button></section>';
if(tab==="movimento")out='<h1>Movimento em casa</h1><div class="notice">Biblioteca ilustrativa demonstrativa. Não há sessões ou prescrições de treino publicadas. Execução, adaptações e segurança exigem revisão de profissional de educação física.</div><div class="grid">'+exercises.map(e=>card(e[0],e[2],'<span class="tag">Pendente de revisão</span>',e[1])).join("")+'</div>';
if(tab==="compras")out='<h1>Minha lista de compras</h1><p class="muted">Adicione ingredientes a partir das receitas ou crie seus próprios itens. A demonstração não consolida unidades equivalentes.</p><div class="card"><div class="row"><input id="newItem" placeholder="Novo item" aria-label="Novo item"/><button class="primary" onclick="addManual()">Adicionar</button><button class="secondary primary" onclick="window.print()">Imprimir</button></div><div style="margin-top:16px">'+(purchased.length?purchased.map((x,i)=>'<div class="check"><input type="checkbox" '+(x.checked?"checked":"")+' onchange="shoppingToggle('+i+')" aria-label="Marcar '+escapeHTML(x.name)+'"/><span style="'+(x.checked?"text-decoration:line-through;color:#627a72":"")+'">'+escapeHTML(x.name)+'</span><button class="secondary primary" style="margin-left:auto" onclick="shoppingDelete('+i+')">Remover</button></div>').join(""):"Sua lista está vazia. Abra uma receita e adicione os ingredientes.")+'</div></div>';
if(tab==="bonus")out='<h1>Bônus do Plano Completo</h1><div class="notice">Acesso premium ainda não configurado. Estes módulos são uma prévia demonstrativa, não conteúdo aprovado.</div><div class="grid">'+card("Bebidas para variar a rotina","14 preparos previstos; conteúdos e contraindicações pendentes de revisão.",'<span class="tag">Em preparação</span>',"🍋")+card("Marmitas práticas","Planejamento de compras, preparo, conservação e reaproveitamento.",'<span class="tag">Em preparação</span>',"🍱")+card("Praia e fim de semana sem culpa","Situações práticas de organização sem punições alimentares.",'<span class="tag">Em preparação</span>',"🏖️")+'</div>';
if(tab==="perfil")out='<h1>Perfil e configurações</h1><div class="card"><h3>Data de início (demonstração)</h3><input type="date" value="'+start+'" onchange="setStart(this.value)"/><p class="muted">A demonstração não cria conta, não cobra valores e não armazena dados em servidor.</p><h3>Planos previstos</h3><p><b>Essencial:</b> R$ 14,90 — missões e organização alimentar.</p><p><b>Completo:</b> R$ 29,90 — também movimento, biblioteca ampliada, compras e bônus.</p><p class="muted">Preços e permissões serão configuráveis no backend de produção.</p><button class="secondary primary" onclick="if(confirm('Apagar progresso e lista desta demonstração?')){localStorage.removeItem('pv21_demo_done');localStorage.removeItem('pv21_demo_list');localStorage.removeItem('pv21_demo_start');done=new Set();purchased=[];start='';render()}">Limpar dados de demonstração</button></div><div class="notice">Login, acesso por plano, painel administrativo, revisão profissional, checkout, política de privacidade e suporte não estão configurados nesta versão.</div>';
app.innerHTML=out}nav();render();
</script></body></html>
